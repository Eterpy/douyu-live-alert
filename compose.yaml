services:
  alert:
    build: .
    image: douyu-live-alert:2.0.2
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "live_alert", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
